services:
  app:
    image: ghcr.io/joaoppassos/jobhub-email-ms:latest
    pull_policy: always
    container_name: jobhub-email-ms
    restart: unless-stopped
    ports:
      - "${PORT:-4240}:4240"
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: jobhub-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-jobhub}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
